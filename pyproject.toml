[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redforge-ai"
version = "1.5.0"
description = "Agentic software engineering platform for repository understanding, autonomous coding, repair, verification, policy, human approval, audit, and GitHub delivery."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Saeid Khalilian" }]
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "httpx>=0.28.0",
    "ruff>=0.12.0",
    "mypy>=1.17.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/redforge"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["backend/redforge"]
